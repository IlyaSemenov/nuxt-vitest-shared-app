name: Test

on:
  push:
    branches: ["**"]
  pull_request:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  compatibility:
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep in sync with the supported versions in README.md and peerDependencies.
          - name: minimum versions
            packages: vitest@5.0.0 nuxt@4.4.2 @nuxt/test-utils@4.3.3 @vue/test-utils@2.4.2 vue@3.5.30 happy-dom@20.0.11

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.8

      - name: Install deps
        run: |
          bun install --frozen-lockfile
          bun add --dev --ignore-scripts ${{ matrix.packages }}

      - name: Test package
        run: bun run test

      - name: Test packed package with Nuxt
        run: bun run test:consumer

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.8

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Check formatting and lint rules
        run: bun run lint:check

      - name: Build package
        run: bun run build

      - name: Typecheck package
        run: bun run types

      - name: Test package
        run: bun run test

      - name: Test packed package with Nuxt
        run: bun run test:consumer
