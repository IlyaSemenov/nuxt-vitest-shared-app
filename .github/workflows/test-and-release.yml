name: Test and Release

env:
  # Keep in sync with .changeset/config.json:baseBranch
  MAIN_REF: refs/heads/main

on:
  push:
    branches: ["**"]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Publish to npm with OIDC
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  compatibility:
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep in sync with the tested versions in README.md and peerDependencies.
          - name: minimum versions
            packages: vitest@4.1.0 nuxt@4.4.2 @vue/test-utils@2.4.2 happy-dom@20.0.11
          - name: Vitest 4
            packages: vitest@^4.1.0

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.15

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install deps
        run: |
          bun install --frozen-lockfile
          bun add --dev --ignore-scripts ${{ matrix.packages }}

      - name: Test package
        run: bun run test

      - name: Test packed package with Nuxt
        run: bun run test:consumer

  test-and-release:
    name: Test and Release
    needs: compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.15

      # for npx publish
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Check formatting and lint rules
        run: bun run lint:check

      - name: Build package
        run: bun run build

      - name: Typecheck package
        run: bun run types

      - name: Test package
        run: bun run test

      - name: Test packed package with Nuxt
        run: bun run test:consumer

      - name: Capture release version
        if: ${{ github.ref == env.MAIN_REF }}
        run: |
          npx @changesets/cli status --output=release.json
          RELEASE_VERSION="$(jq -r '.releases[0].newVersion // empty' release.json)"
          if [ -z "$RELEASE_VERSION" ]; then
            RELEASE_VERSION="$(jq -r '.version' package.json)"
          fi
          echo "RELEASE=Version $RELEASE_VERSION" >> "$GITHUB_ENV"
          rm release.json

      - name: Create Release Pull Request or Publish to npm
        if: ${{ github.ref == env.MAIN_REF }}
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
          title: ${{ env.RELEASE }}
          commit: ${{ env.RELEASE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Bootstrap only. Remove after configuring Trusted Publishing.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
